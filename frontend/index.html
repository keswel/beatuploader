<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Inline SVG favicon — no public/ asset needed; matches the Disc3 brand mark. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e4e4e7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><circle cx='12' cy='12' r='4'/><line x1='12' y1='2' x2='12' y2='4'/><line x1='12' y1='20' x2='12' y2='22'/><line x1='20' y1='12' x2='22' y2='12'/><line x1='2' y1='12' x2='4' y2='12'/></svg>"
    />

    <title>Beatuploader — Ship every beat everywhere at once</title>
    <meta
      name="description"
      content="Upload a beat once. Beatuploader pushes it to BeatStars, YouTube, and the rest with the right files, licenses, and metadata."
    />
    <meta name="theme-color" content="#09090b" />

    <!-- Open Graph / Twitter — link previews look good when someone shares the URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Beatuploader" />
    <meta
      property="og:description"
      content="Ship every beat to every platform at once. BeatStars, YouTube, and more — from one upload."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Beatuploader" />
    <meta
      name="twitter:description"
      content="Ship every beat to every platform at once."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
