<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beatuploader</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #fafafa;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: grid; place-items: center; user-select: none; }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .spinner { width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid #27272a; border-top-color: #a1a1aa;
        animation: spin 0.8s linear infinite; }
      #status { color: #71717a; }
      .error .spinner { display: none; }
      .error #status { color: #f87171; max-width: 420px; text-align: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Shown while the shell boots the local backend; the shell then navigates
         this window to http://127.0.0.1:<port>. On failure it calls showError(). -->
    <div class="wrap" id="wrap">
      <div class="spinner"></div>
      <div id="status">Starting Beatuploader…</div>
    </div>
    <script>
      window.showError = (msg) => {
        document.getElementById("wrap").classList.add("error");
        document.getElementById("status").textContent = msg;
      };
    </script>
  </body>
</html>
