# Render Blueprint for the Beatuploader backend.
#
# What this provisions (free-tier deploy):
#   - One web service running the FastAPI app from backend/Dockerfile (free tier)
#   - NO database. Postgres lives on Neon (free tier, no expiry) — see
#     DATABASE_URL below. Render's free Postgres was dropped because it is
#     deleted after 90 days.
#   - NO persistent disk — free tier doesn't support disks. Uploaded files
#     live on the ephemeral container filesystem and are lost on every deploy
#     or restart. Acceptable for MVP since files are streamed straight to
#     BeatStars / YouTube; only retry-from-disk is impacted.
#
# Free-tier caveats:
#   - Web service spins down after 15 min of no traffic. Use UptimeRobot
#     (or similar) to ping /health every 5 min to keep it warm.
#   - Neon free compute scales to zero after ~5 min idle. First query after
#     an idle period pays a cold start; `pool_pre_ping=True` in app/db.py
#     keeps SQLAlchemy from handing out connections dropped in the meantime.
#   - Free web service has 512 MB RAM, same as starter. Playwright + Chromium
#     will be tight; expect occasional OOM on heavier BeatStars uploads.
#
# What you still configure manually in the Render dashboard:
#   - All entries marked `sync: false` below — Render will prompt for these on
#     first deploy. Keep them out of source for obvious reasons.
#   - Custom domain mapping (Settings → Custom Domains)
#   - Health-check path override (already set below)
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. In Render → New → Blueprint, point at the repo. Render reads this file.
#   3. Fill in the prompted secrets. See DEPLOY.md for how to generate them.
#   4. After first deploy succeeds, copy the backend URL into BACKEND_BASE_URL,
#      add your frontend domain to CORS_ORIGINS + FRONTEND_BASE_URL, redeploy.
#   5. Update Google Cloud Console OAuth redirect URIs to the prod backend URL.
#
# IMPORTANT: this file pins the backend to a SINGLE worker. The app's rate
# limiter is in-memory and `init_db()` runs migrations on every boot — both
# of which break under multiple workers/instances. Scaling out requires
# (a) Redis-backed rate limiter and (b) a one-shot migration job. See
# CLAUDE.md "Pitfalls".

# No `databases:` block — Postgres is hosted on Neon (free tier, no expiry),
# not Render. DATABASE_URL is set manually in the Render dashboard; see the
# note on that env var below.

services:
  - type: web
    name: beatuploader-api
    runtime: docker
    plan: free          # 512MB RAM, spins down after 15 min idle (see header)
    region: oregon      # change if you want eu-frankfurt / singapore / etc.
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Migrations run on boot via init_db() — see RUN_MIGRATIONS_ON_BOOT below.
    # Free tier doesn't support preDeployCommand, but since we're pinned to a
    # single instance there's no version-lock race to worry about. When you
    # upgrade to a paid plan, re-add `preDeployCommand: python -m app.migrate`
    # and flip RUN_MIGRATIONS_ON_BOOT back to "false".
    # No `disk:` block — free tier doesn't support persistent disks. The app
    # falls back to writing under /app/storage on the container's ephemeral
    # FS. Files are lost on restart; that's accepted for the free-tier MVP.
    envVars:
      # --- Required, set in Render dashboard ---
      # Neon connection string for the `production` branch of project
      # misty-voice-04631137. Use the DIRECT (non-pooled) host — the one
      # WITHOUT `-pooler` in it. Neon's pooled endpoint is PgBouncer in
      # transaction mode, which breaks asyncpg's prepared-statement cache
      # unless you also pass statement_cache_size=0. We run a single instance
      # with SQLAlchemy's own pool, so the direct endpoint is the right fit.
      # `?sslmode=require&channel_binding=require` is stripped by
      # app/db.py::_async_database_url; TLS is then applied via connect_args.
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8000

      # --- Required, set in Render dashboard (sync: false hides from blueprint) ---
      - key: DEBUG
        value: "false"
      # Free tier: migrations run on boot via init_db(). Safe because we're
      # pinned to a single instance — no version-lock race. Flip to "false"
      # when you move to a paid plan with preDeployCommand.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a 256-bit secret
      - key: TOKEN_ENCRYPTION_KEY
        sync: false                # MUST be a Fernet key — see DEPLOY.md
      - key: BACKEND_BASE_URL
        sync: false                # e.g. https://api.beatuploader.com
      - key: FRONTEND_BASE_URL
        sync: false                # e.g. https://beatuploader.com
      - key: CORS_ORIGINS
        sync: false                # comma-separated list of frontend origins

      # --- Google OAuth (for YouTube + sign-in) ---
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false

      # --- Email (password reset, future verification) ---
      # Resend is the recommended provider; SMTP_HOST = smtp.resend.com,
      # SMTP_USER = resend, SMTP_PASSWORD = your Resend API key.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false                # e.g. "Beatuploader <noreply@beatuploader.com>"

      # --- Error tracking (optional but recommended) ---
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
